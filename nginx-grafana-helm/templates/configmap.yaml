apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nginx-grafana.fullname" . }}-config
  labels:
    {{- include "nginx-grafana.labels" . | nindent 4 }}
data:
  grafana.conf: |
    upstream grafana {
        server {{ .Values.grafana.upstream.server }};
    }

    server {
        listen 80;
        listen [::]:80;
        server_name {{ .Values.grafana.serverName }};
{{- if .Values.grafana.ssl.enabled }}
        listen 443 ssl http2;
        ssl_certificate     {{ .Values.grafana.ssl.certificate }};
        ssl_certificate_key {{ .Values.grafana.ssl.certificateKey }};
{{- end }}

        # =====================================================
        # БЛОКИРОВКА РЕДАКТИРОВАНИЯ (Read-Only Mode)
        # ВАЖНО: Исключения (разрешения) ДОЛЖНЫ идти ВЫШЕ ограничений.
        # Nginx обрабатывает regex location'ы сверху вниз, первое совпадение выигрывает.
        # =====================================================

        # --- 1. ИСКЛЮЧЕНИЯ (Разрешаем ЛЮБЫЕ методы для этих путей) ---

        # Звёздочки (избранное) на дашбордах
        location ~ ^/api/dashboards/uid/[^/]+/stars$ {
            proxy_pass http://grafana;
            include /etc/nginx/proxy_params_grafana.conf;
        }

        # Proxy-запросы к источникам данных (Prometheus, Loki, InfluxDB и др.)
        location ~ ^/api/datasources/proxy/ {
            proxy_pass http://grafana;
            include /etc/nginx/proxy_params_grafana.conf;
        }

        # Backend resources у датасорсов: поддержка И UID, И числового ID
        location ~ ^/api/datasources/(uid/[^/]+|[0-9]+)/resources/ {
            proxy_pass http://grafana;
            include /etc/nginx/proxy_params_grafana.conf;
        }

        # --- 2. ОГРАНИЧЕНИЯ (Разрешаем ТОЛЬКО GET, остальное deny all) ---

        # Дашборды: блокирует создание, сохранение, импорт, удаление
        location ~ ^/api/dashboards/ {
            limit_except GET { deny all; }
            proxy_pass http://grafana;
            include /etc/nginx/proxy_params_grafana.conf;
        }

        # Источники данных (управление): блокирует добавление/изменение/удаление подключений
        location ~ ^/api/datasources(/|$) {
            limit_except GET { deny all; }
            proxy_pass http://grafana;
            include /etc/nginx/proxy_params_grafana.conf;
        }

        # Библиотечные панели (Library Panels): блокирует создание и редактирование
        location ~ ^/api/library-elements(/|$) {
            limit_except GET { deny all; }
            proxy_pass http://grafana;
            include /etc/nginx/proxy_params_grafana.conf;
        }

        # Папки: блокирует создание, переименование, удаление, перемещение
        location ~ ^/api/folders(/|$) {
            limit_except GET { deny all; }
            proxy_pass http://grafana;
            include /etc/nginx/proxy_params_grafana.conf;
        }

        # Ruler API: блокирует создание/изменение/удаление правил алертинга
        location ~ ^/api/ruler/ {
            limit_except GET { deny all; }
            proxy_pass http://grafana;
            include /etc/nginx/proxy_params_grafana.conf;
        }

        # Unified Alerting Provisioning (Grafana 9+)
        location ~ ^/api/v1/provisioning/ {
            limit_except GET { deny all; }
            proxy_pass http://grafana;
            include /etc/nginx/proxy_params_grafana.conf;
        }

        # Legacy Alerting (Grafana < 9)
        location ~ ^/api/alerts(/|$) {
            limit_except GET { deny all; }
            proxy_pass http://grafana;
            include /etc/nginx/proxy_params_grafana.conf;
        }
        
        location ~ ^/api/alert-notifications(/|$) {
            limit_except GET { deny all; }
            proxy_pass http://grafana;
            include /etc/nginx/proxy_params_grafana.conf;
        }

        # Аннотации: блокирует создание/удаление аннотаций на графиках
        location ~ ^/api/annotations(/|$) {
            limit_except GET { deny all; }
            proxy_pass http://grafana;
            include /etc/nginx/proxy_params_grafana.conf;
        }

        # Пользователи, команды и организации
        location ~ ^/api/(users|teams|org|orgs)(/|$) {
            limit_except GET { deny all; }
            proxy_pass http://grafana;
            include /etc/nginx/proxy_params_grafana.conf;
        }

        # Сервисные аккаунты и API-ключи
        location ~ ^/api/(serviceaccounts|auth/keys)(/|$) {
            limit_except GET { deny all; }
            proxy_pass http://grafana;
            include /etc/nginx/proxy_params_grafana.conf;
        }

        # =====================================================
        # КОНЕЦ БЛОКИРОВКИ
        # =====================================================

        # Всё остальное — без ограничений 
        location / {
            proxy_pass http://grafana;
            include /etc/nginx/proxy_params_grafana.conf;
        }
    }
  
  proxy_params_grafana.conf: |
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
